<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found · Nariman Khaleghi</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono&family=Vazirmatn:wght@400;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:20px;padding:40px 20px;background:#0a0a0a;color:#fff;position:relative;overflow:hidden;
      font-family:"Space Grotesk","Vazirmatn",system-ui,sans-serif;text-align:center;
      background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
      background-size:52px 52px;
    }
    .code{font-family:"Archivo Black","Vazirmatn",sans-serif;font-weight:900;font-size:clamp(6rem,26vw,15rem);line-height:.9;color:transparent;-webkit-text-stroke:3px #fff}
    h1{font-family:"Archivo Black","Vazirmatn",sans-serif;font-weight:900;text-transform:uppercase;font-size:clamp(1.2rem,4vw,2rem)}
    p{color:rgba(255,255,255,.6);max-width:44ch;line-height:1.8}
    .btn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#0a0a0a;border:3px solid #fff;
      box-shadow:6px 6px 0 rgba(255,255,255,.9);padding:14px 26px;font-family:"Archivo Black","Vazirmatn",sans-serif;
      font-weight:900;text-transform:uppercase;letter-spacing:.06em;text-decoration:none;margin-top:8px;
      transition:transform .15s,box-shadow .15s}
    .btn:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 rgba(255,255,255,.9)}
  </style>
</head>
<body>
  <div class="code" aria-hidden="true">404</div>
  <h1>صفحه پیدا نشد — Page not found</h1>
  <p>این مسیر در نقشه‌ی ما نیست. بذار به خانه برگردیم / This route isn't on the map. Let's head back home.</p>
  <a class="btn" href="./index.html">← Back home</a>
</body>
</html>
